<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#143E34" />
      <stop offset="65%" stop-color="#0A231E" />
      <stop offset="100%" stop-color="#041410" />
    </radialGradient>
    
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE7B2" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#A87F2E" />
      <stop offset="75%" stop-color="#E8C676" />
      <stop offset="100%" stop-color="#966A21" />
    </linearGradient>

    <linearGradient id="facetTable" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF6DF" />
      <stop offset="100%" stop-color="#F4D68B" />
    </linearGradient>

    <linearGradient id="facetLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0CB" />
      <stop offset="100%" stop-color="#E4BA60" />
    </linearGradient>

    <linearGradient id="facetMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECC66C" />
      <stop offset="100%" stop-color="#B28630" />
    </linearGradient>

    <linearGradient id="facetDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C79B3D" />
      <stop offset="100%" stop-color="#8E631B" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Medallion -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" />
  
  <!-- Outer Double Gold Rings -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#goldRim)" stroke-width="12" />
  <circle cx="256" cy="256" r="224" fill="none" stroke="#C6A66B" stroke-width="2.5" stroke-opacity="0.7" />

  <!-- Diamond / Jewel Emblem -->
  <g id="gem" filter="url(#glow)">
    <!-- Center Table -->
    <polygon points="200,160 312,160 340,226 172,226" fill="url(#facetTable)" />

    <!-- Left Crown Kite -->
    <polygon points="180,160 200,160 172,226 108,226" fill="url(#facetMid)" />

    <!-- Right Crown Kite -->
    <polygon points="312,160 332,160 404,226 340,226" fill="url(#facetDeep)" />

    <!-- Pavilion Facets (Bottom) -->
    <polygon points="108,226 182,226 256,376" fill="url(#facetDeep)" />
    <polygon points="182,226 256,226 256,376" fill="url(#facetLight)" />
    <polygon points="256,226 330,226 256,376" fill="url(#facetMid)" />
    <polygon points="330,226 404,226 256,376" fill="url(#facetDeep)" />

    <!-- Facet outlines -->
    <polygon points="108,226 180,160 332,160 404,226 256,376" fill="none" stroke="#FFF4D4" stroke-width="4" stroke-linejoin="round" />
    <line x1="200" y1="160" x2="172" y2="226" stroke="#FFF4D4" stroke-width="2.5" />
    <line x1="312" y1="160" x2="340" y2="226" stroke="#FFF4D4" stroke-width="2.5" />
    <line x1="182" y1="226" x2="256" y2="376" stroke="#FFF4D4" stroke-width="2.5" />
    <line x1="256" y1="226" x2="256" y2="376" stroke="#FFF4D4" stroke-width="2.5" />
    <line x1="330" y1="226" x2="256" y2="376" stroke="#FFF4D4" stroke-width="2.5" />
  </g>

  <!-- Brilliant Star Sparkle on crown -->
  <path d="M 336,140 Q 336,158 354,158 Q 336,158 336,176 Q 336,158 318,158 Q 336,158 336,140 Z" fill="#FFFFFF" />
  <circle cx="336" cy="158" r="3.5" fill="#FFF9E5" />
</svg>